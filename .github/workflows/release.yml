name: Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS Apple Silicon (ARM64)
            os: macos-15
            target: aarch64-apple-darwin
            archive_name: cmdmind-${{ github.ref_name }}-macos-aarch64.tar.gz
            is_windows: false

          - name: macOS Intel (x86_64)
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive_name: cmdmind-${{ github.ref_name }}-macos-x86_64.tar.gz
            is_windows: false

          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: cmdmind-${{ github.ref_name }}-windows-x86_64.zip
            is_windows: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Run test suite
        run: cargo test --target ${{ matrix.platform.target }}

      - name: Package release artifact (Unix)
        if: ${{ !matrix.platform.is_windows }}
        run: |
          mkdir -p stage/zsh
          cp target/${{ matrix.platform.target }}/release/cmdmind stage/
          chmod +x stage/cmdmind
          cp zsh/cmdmind.zsh stage/zsh/
          cp install.sh stage/
          chmod +x stage/install.sh
          cp uninstall.sh stage/
          chmod +x stage/uninstall.sh
          cp README.md stage/
          cp LICENSE stage/
          tar -czf ${{ matrix.platform.archive_name }} -C stage .

      - name: Package release artifact (Windows)
        if: ${{ matrix.platform.is_windows }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage/zsh | Out-Null
          Copy-Item target/${{ matrix.platform.target }}/release/cmdmind.exe stage/
          Copy-Item zsh/cmdmind.zsh stage/zsh/
          Copy-Item install.sh stage/
          Copy-Item uninstall.sh stage/
          Copy-Item README.md stage/
          Copy-Item LICENSE stage/
          Compress-Archive -Path stage/* -DestinationPath ${{ matrix.platform.archive_name }} -CompressionLevel Optimal

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.archive_name }}
          path: ${{ matrix.platform.archive_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and generate SHA256SUMS
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} release_assets/ \;
          cd release_assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_assets/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
